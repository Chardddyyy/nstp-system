    <script type="text/javascript">
      // Ensure current window/tab can be reused by email OTP links without opening new tabs
      window.name = "nstp_system_tab";
      // Single Page Apps for GitHub Pages with Hash and Path Support
      (function(l) {
        // 1. If URL has hash route like /#/digital-id?id=... convert to path /digital-id?id=...
        if (l.hash && l.hash.startsWith('#/')) {
          var hashParts = l.hash.slice(2).split('?');
          var route = hashParts[0];
          var query = hashParts[1] || '';
          var basePath = l.pathname.endsWith('/') ? l.pathname : l.pathname + '/';
          if (route) {
            window.history.replaceState(null, null, basePath + route + (query ? '?' + query : ''));
          }
        }
        // 2. If redirected by 404.html using /?/route
        if (l.search && (l.search.startsWith('/?') || l.search[1] === '/')) {
          var searchStr = l.search.startsWith('/?') ? l.search.slice(2) : l.search.slice(1);
          var decoded = searchStr.split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          if (!decoded.startsWith('/')) decoded = '/' + decoded;
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
              basePath + decoded + l.hash
          );
        }
      }(window.location));

      // Automatically recover when a new deploy invalidates old cached chunk filenames
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite preload error (new deployment detected), refreshing...');
        window.location.reload();
      });

      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var src = e.target.src || e.target.href || '';
          if (src.includes('/assets/') && !sessionStorage.getItem('asset_retry_' + src)) {
            sessionStorage.setItem('asset_retry_' + src, '1');
            console.warn('Asset chunk 404 detected, auto-refreshing page...');
            window.location.reload();
          }
        }
      }, true);
    </script>
