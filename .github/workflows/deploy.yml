name: Production CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Test & Build (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS with NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Backend Module Syntax
        run: |
          cd backend
          npm ci
          node --check server.js
          node --check routes/index.js
          node --check middleware/errorHandler.js

      - name: Build Frontend Application
        run: npm run build

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-render:
    name: Trigger Render Backend Deployment Hook
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render Deploy Hook (If Configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment webhook..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
            echo "Render deployment hook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping webhook trigger."
          fi
