services:
  # CvSU Naic NSTP Record & Report Management System - Backend API Web Service
  - type: web
    name: nstp-system-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set this to your Aiven MySQL URI (e.g. mysql://avnadmin:pass@host:port/defaultdb?ssl-mode=REQUIRED)
      - key: DB_NAME
        value: nstp_system
      - key: DB_SSL
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://chardddyyy.github.io,https://chardddddyyyyy.github.io,http://localhost:5173"
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GDRIVE_WEBHOOK_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
