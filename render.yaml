# Render Cloud Infrastructure as Code (IaC) Blueprint
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nstp-system-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://chardddyyy.github.io,http://localhost:5173,http://localhost:3000"
      - key: GDRIVE_WEBHOOK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        value: "cvsunaicnstp@gmail.com"
      - key: EMAIL_PASS
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        value: "CvSU-NSTP"
      - key: GDRIVE_WEBHOOK_URL
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
