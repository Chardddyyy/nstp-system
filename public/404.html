<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NSTP System</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var pathSegmentsToKeep = l.pathname.toLowerCase().startsWith('/nstp-system') ? 1 : 0;
      var pathParts = l.pathname.split('/').filter(Boolean);
      var baseSegment = pathSegmentsToKeep > 0 ? '/' + pathParts.slice(0, pathSegmentsToKeep).join('/') : '';
      var routePath = pathParts.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        baseSegment + '/?/' +
        routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
